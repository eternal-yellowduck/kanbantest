<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" id="meta-theme" content="#070a14">
<title>星际弹球</title>
<style>
:root {
  color-scheme: dark;
  --page-bg: radial-gradient(1200px 800px at 50% -10%, #101735, #070a14);
  --text: #b7c9e2;
  --text-strong: #e9f3ff;
  --canvas-bg: #0b0f1c;
  --canvas-glow: rgba(61, 110, 255, 0.18);
  --btn-grad: linear-gradient(180deg, #98b5ff, #2d4790);
  --btn-shadow: 0 4px 12px rgba(80, 120, 255, 0.35);
  --btn-shadow-active: 0 1px 4px rgba(80, 120, 255, 0.25);
  --bump-color: #ffffff;
}
:root[data-theme='light'] {
  color-scheme: light;
  --page-bg: radial-gradient(1200px 800px at 50% -10%, #f7faff, #dfe8f7);
  --text: #5a6b85;
  --text-strong: #26344c;
  --canvas-bg: #eef3fc;
  --canvas-glow: rgba(47, 95, 232, 0.12);
  --btn-grad: linear-gradient(180deg, #6d8cff, #3355c0);
  --btn-shadow: 0 4px 12px rgba(70, 110, 240, 0.3);
  --btn-shadow-active: 0 1px 4px rgba(70, 110, 240, 0.22);
  --bump-color: #1d4ed8;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--page-bg);
  font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
  color: var(--text);
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  user-select: none;
  -webkit-user-select: none;
}
.stage { width: 100%; max-width: 400px; padding: 12px 12px 20px; }
#game {
  display: block;
  width: 100%;
  max-width: 400px;
  aspect-ratio: 4 / 5;
  height: auto;
  border-radius: 12px;
  background: var(--canvas-bg);
  box-shadow: 0 0 24px var(--canvas-glow);
  touch-action: none;
}
.hud {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 12px;
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--text-strong);
}
#score { display: inline-block; min-width: 2ch; }
#score.bump { animation: bump 0.18s ease; }
@keyframes bump { 50% { transform: scale(1.4); color: var(--bump-color); } }
#btn-restart {
  border: none;
  border-radius: 10px;
  padding: 10px 20px;
  min-width: 44px;
  min-height: 44px;
  font: inherit;
  font-size: 1rem;
  color: #e9f3ff;
  background: var(--btn-grad);
  box-shadow: var(--btn-shadow);
  cursor: pointer;
  transition: transform 0.06s ease, box-shadow 0.06s ease;
}
#btn-restart:active { transform: translateY(2px); box-shadow: var(--btn-shadow-active); }
.hud-lives { letter-spacing: 2px; }
.hint { margin: 10px 0 0; text-align: center; font-size: 0.8rem; letter-spacing: 2px; color: var(--text); opacity: 0.75; }
#btn-theme {
  border: none;
  border-radius: 10px;
  min-width: 44px;
  min-height: 44px;
  padding: 8px 10px;
  font: inherit;
  font-size: 1.1rem;
  line-height: 1;
  color: var(--text-strong);
  background: transparent;
  cursor: pointer;
  transition: transform 0.06s ease, opacity 0.06s ease;
  opacity: 0.85;
}
#btn-theme:hover { opacity: 1; }
#btn-theme:active { transform: translateY(2px); }
</style>
</head>
<body>
<div class="stage">
  <canvas id="game" width="400" height="500"></canvas>
  <div class="hud">
    <div class="hud-score">得分 <span id="score">0</span></div>
    <button id="btn-theme" type="button" aria-label="切换明暗主题" title="切换明暗主题">☀️</button>
    <button id="btn-restart" type="button">↻ 重来</button>
    <div class="hud-lives" id="lives">❤️❤️❤️</div>
  </div>
  <p class="hint">← 拖动 / 移动鼠标 → 控制挡板</p>
</div>
<script>
(function () {
  'use strict';

  var CONFIG = {
    ballRadius: 7,
    ballSpeed: 4.8,
    paddleWidth: 90,
    paddleHeight: 14,
    paddleBottomMargin: 28,
    brickRows: 5,
    brickCols: 8,
    brickWidth: 42,
    brickHeight: 16,
    brickGap: 6,
    brickTopOffset: 60,
    maxLives: 3
  };

  var W = 400;
  var H = 500;
  var PADDLE_Y = H - CONFIG.paddleBottomMargin - CONFIG.paddleHeight;

  // 明暗两套主题：画布内配色由 theme 对象驱动，页面配色由 CSS 变量驱动
  var THEMES = {
    dark: {
      pageThemeColor: '#070a14',
      buttonIcon: '☀️',
      bgTop: '#070a14',
      bgBottom: '#0b0f1c',
      star: '#ffffff',
      brickHighlight: 'rgba(255,255,255,0.22)',
      paddleGlow: '#98b5ff',
      paddleTop: '#98b5ff',
      paddleBottom: '#2d4790',
      paddleHighlight: 'rgba(255,255,255,0.35)',
      ballGlow: '#3d6eff',
      ballEdge: '#3d6eff',
      hint: '#b7c9e2',
      winText: '#7dffb2',
      loseText: '#ff6b81'
    },
    light: {
      pageThemeColor: '#dfe8f7',
      buttonIcon: '🌙',
      bgTop: '#f2f6ff',
      bgBottom: '#dce6f7',
      star: 'rgba(120, 150, 220, 0.35)',
      brickHighlight: 'rgba(255,255,255,0.55)',
      paddleGlow: 'rgba(70, 110, 240, 0.5)',
      paddleTop: '#6d8cff',
      paddleBottom: '#3355c0',
      paddleHighlight: 'rgba(255,255,255,0.7)',
      ballGlow: 'rgba(47, 95, 232, 0.45)',
      ballEdge: '#2f5fe8',
      hint: '#5a6b85',
      winText: '#0f9d6a',
      loseText: '#d64560'
    }
  };

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var livesEl = document.getElementById('lives');
  var restartBtn = document.getElementById('btn-restart');
  var themeBtn = document.getElementById('btn-theme');
  var metaTheme = document.getElementById('meta-theme');

  var currentThemeKey = 'dark';
  var theme = THEMES.dark;

  var paddle = { x: 0, y: PADDLE_Y, w: CONFIG.paddleWidth, h: CONFIG.paddleHeight };
  var ball = { x: 0, y: 0, dx: 0, dy: 0, r: CONFIG.ballRadius, speed: CONFIG.ballSpeed };
  var bricks = [];

  var score = 0;
  var lives = CONFIG.maxLives;
  var gameActive = false;
  var gameWin = false;
  var gameOver = false;
  var paddleTarget = W / 2;

  var bgGradient = null;
  var paddleGradient = null;
  var ballGradient = null;
  var stars = [];

  function clamp(v, min, max) {
    return v < min ? min : (v > max ? max : v);
  }

  function pathRoundRect(c, x, y, w, h, r) {
    var rr = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + rr, y);
    c.arcTo(x + w, y, x + w, y + h, rr);
    c.arcTo(x + w, y + h, x, y + h, rr);
    c.arcTo(x, y + h, x, y, rr);
    c.arcTo(x, y, x + w, y, rr);
    c.closePath();
  }

  function setupCanvas() {
    var dpr = window.devicePixelRatio || 1;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    rebuildGradients();
  }

  function rebuildGradients() {
    bgGradient = ctx.createLinearGradient(0, 0, 0, H);
    bgGradient.addColorStop(0, theme.bgTop);
    bgGradient.addColorStop(1, theme.bgBottom);
    paddleGradient = ctx.createLinearGradient(0, PADDLE_Y, 0, PADDLE_Y + paddle.h);
    paddleGradient.addColorStop(0, theme.paddleTop);
    paddleGradient.addColorStop(1, theme.paddleBottom);
    ballGradient = ctx.createRadialGradient(-2, -2, 1, 0, 0, ball.r);
    ballGradient.addColorStop(0, '#ffffff');
    ballGradient.addColorStop(1, theme.ballEdge);
  }

  function applyTheme(key, persist) {
    if (!THEMES[key]) return;
    currentThemeKey = key;
    theme = THEMES[key];
    document.documentElement.setAttribute('data-theme', key);
    metaTheme.setAttribute('content', theme.pageThemeColor);
    themeBtn.textContent = theme.buttonIcon;
    rebuildGradients();
    if (persist) {
      try { localStorage.setItem('starball-theme', key); } catch (e) { /* 忽略存储失败 */ }
    }
  }

  function toggleTheme() {
    applyTheme(currentThemeKey === 'dark' ? 'light' : 'dark', true);
  }

  function initStars() {
    stars = [];
    for (var i = 0; i < 70; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        s: 0.6 + Math.random() * 1.4,
        a: 0.5 + Math.random() * 0.4
      });
    }
  }

  function initBricks() {
    bricks = [];
    var totalW = CONFIG.brickCols * CONFIG.brickWidth + (CONFIG.brickCols - 1) * CONFIG.brickGap;
    var left = (W - totalW) / 2;
    for (var row = 0; row < CONFIG.brickRows; row++) {
      var hue = 200 + (90 * row) / (CONFIG.brickRows - 1);
      for (var col = 0; col < CONFIG.brickCols; col++) {
        bricks.push({
          x: left + col * (CONFIG.brickWidth + CONFIG.brickGap),
          y: CONFIG.brickTopOffset + row * (CONFIG.brickHeight + CONFIG.brickGap),
          w: CONFIG.brickWidth,
          h: CONFIG.brickHeight,
          color: 'hsl(' + hue + ', 70%, 60%)',
          alive: true
        });
      }
    }
  }

  function resetPaddle() {
    paddle.w = CONFIG.paddleWidth;
    paddle.h = CONFIG.paddleHeight;
    paddle.y = PADDLE_Y;
    paddle.x = (W - paddle.w) / 2;
    paddleTarget = paddle.x + paddle.w / 2;
  }

  function resetBall() {
    ball.r = CONFIG.ballRadius;
    ball.speed = CONFIG.ballSpeed;
    ball.dx = 0;
    ball.dy = 0;
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
  }

  function launchBall() {
    if (gameActive || gameOver || gameWin) return;
    var angle = Math.random() * 0.6 - 0.3;
    ball.dx = Math.sin(angle) * ball.speed;
    ball.dy = -Math.cos(angle) * ball.speed;
    gameActive = true;
  }

  function resetGame() {
    score = 0;
    lives = CONFIG.maxLives;
    gameActive = false;
    gameWin = false;
    gameOver = false;
    resetPaddle();
    initBricks();
    resetBall();
    updateHUD();
  }

  function aliveBrickCount() {
    var n = 0;
    for (var i = 0; i < bricks.length; i++) {
      if (bricks[i].alive) n++;
    }
    return n;
  }

  function updateHUD() {
    scoreEl.textContent = String(score);
    livesEl.textContent = lives > 0 ? '❤️'.repeat(lives) : '—';
  }

  function bumpScore() {
    updateHUD();
    scoreEl.classList.remove('bump');
    void scoreEl.offsetWidth;
    scoreEl.classList.add('bump');
  }

  function circleRectHit(cx, cy, r, rect) {
    var closestX = clamp(cx, rect.x, rect.x + rect.w);
    var closestY = clamp(cy, rect.y, rect.y + rect.h);
    var dx = cx - closestX;
    var dy = cy - closestY;
    return dx * dx + dy * dy < r * r;
  }

  function bounceOffBrick(brick) {
    var cx = brick.x + brick.w / 2;
    var cy = brick.y + brick.h / 2;
    var overlapX = (brick.w / 2 + ball.r) - Math.abs(ball.x - cx);
    var overlapY = (brick.h / 2 + ball.r) - Math.abs(ball.y - cy);
    if (overlapX < overlapY) {
      var sideX = ball.x < cx ? -1 : 1;
      ball.dx = Math.abs(ball.dx) * sideX;
      ball.x = cx + sideX * (brick.w / 2 + ball.r + 0.1);
    } else {
      var sideY = ball.y < cy ? -1 : 1;
      ball.dy = Math.abs(ball.dy) * sideY;
      ball.y = cy + sideY * (brick.h / 2 + ball.r + 0.1);
    }
  }

  function bounceOffPaddle() {
    var hitPos = clamp((ball.x - paddle.x) / paddle.w, 0, 1);
    var angle = (hitPos - 0.5) * 1.8;
    ball.dx = Math.sin(angle) * ball.speed;
    ball.dy = -Math.cos(angle) * ball.speed;
    ball.y = paddle.y - ball.r - 0.1;
  }

  function handleCollisions() {
    if (ball.x - ball.r < 0) {
      ball.x = ball.r;
      ball.dx = Math.abs(ball.dx);
    }
    if (ball.x + ball.r > W) {
      ball.x = W - ball.r;
      ball.dx = -Math.abs(ball.dx);
    }
    if (ball.y - ball.r < 0) {
      ball.y = ball.r;
      ball.dy = Math.abs(ball.dy);
    }
    if (ball.dy > 0 && circleRectHit(ball.x, ball.y, ball.r, paddle)) {
      bounceOffPaddle();
    }
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      if (!circleRectHit(ball.x, ball.y, ball.r, b)) continue;
      b.alive = false;
      score += 10;
      bumpScore();
      bounceOffBrick(b);
      if (aliveBrickCount() === 0) {
        score += 50;
        gameWin = true;
        gameActive = false;
        bumpScore();
      }
      break;
    }
  }

  function loseLife() {
    lives -= 1;
    gameActive = false;
    updateHUD();
    if (lives <= 0) {
      gameOver = true;
    } else {
      resetBall();
    }
  }

  function update(factor) {
    var targetX = clamp(paddleTarget - paddle.w / 2, 0, W - paddle.w);
    paddle.x += (targetX - paddle.x) * 0.28;

    if (gameOver || gameWin) return;

    if (!gameActive) {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - ball.r - 1;
      return;
    }

    var steps = 2;
    for (var i = 0; i < steps && gameActive; i++) {
      ball.x += (ball.dx * factor) / steps;
      ball.y += (ball.dy * factor) / steps;
      handleCollisions();
      if (!gameActive) break;
      if (ball.y - ball.r > H) loseLife();
    }
  }

  function drawStatus(now) {
    ctx.textAlign = 'center';
    if (!gameActive && !gameOver && !gameWin) {
      ctx.font = '16px "Segoe UI", Roboto, system-ui, sans-serif';
      ctx.fillStyle = theme.hint;
      ctx.globalAlpha = 0.55 + 0.45 * Math.abs(Math.sin(now / 500));
      ctx.fillText('点击发射', W / 2, paddle.y - 40);
      ctx.globalAlpha = 1;
    } else if (gameOver || gameWin) {
      ctx.save();
      ctx.shadowColor = gameWin ? theme.winText : theme.loseText;
      ctx.shadowBlur = 18;
      ctx.fillStyle = gameWin ? theme.winText : theme.loseText;
      ctx.font = 'bold 20px "Segoe UI", Roboto, system-ui, sans-serif';
      ctx.fillText(gameWin ? '胜利！' : '游戏结束', W / 2, H / 2 - 10);
      ctx.restore();
      ctx.font = '16px "Segoe UI", Roboto, system-ui, sans-serif';
      ctx.fillStyle = theme.hint;
      ctx.fillText('最终得分 ' + score, W / 2, H / 2 + 18);
      ctx.fillText('点击画面重新开始', W / 2, H / 2 + 42);
    }
  }

  function draw(now) {
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = theme.star;
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      ctx.globalAlpha = s.a;
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }
    ctx.globalAlpha = 1;

    for (var j = 0; j < bricks.length; j++) {
      var b = bricks[j];
      if (!b.alive) continue;
      ctx.save();
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 8;
      ctx.fillStyle = b.color;
      pathRoundRect(ctx, b.x, b.y, b.w, b.h, 4);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = theme.brickHighlight;
      ctx.fillRect(b.x + 2, b.y + 2, b.w - 4, 3);
      ctx.restore();
    }

    ctx.save();
    ctx.shadowColor = theme.paddleGlow;
    ctx.shadowBlur = 12;
    ctx.fillStyle = paddleGradient;
    pathRoundRect(ctx, paddle.x, paddle.y, paddle.w, paddle.h, 7);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = theme.paddleHighlight;
    ctx.fillRect(paddle.x + 6, paddle.y + 2, paddle.w - 12, 2);
    ctx.restore();

    if (!gameOver) {
      ctx.save();
      ctx.translate(ball.x, ball.y);
      ctx.shadowColor = theme.ballGlow;
      ctx.shadowBlur = 14;
      ctx.fillStyle = ballGradient;
      ctx.beginPath();
      ctx.arc(0, 0, ball.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    drawStatus(now);
  }

  var lastTs = 0;
  function gameLoop(ts) {
    var dt = ts - lastTs;
    lastTs = ts;
    if (!(dt > 0)) dt = 16.7;
    var factor = clamp(dt / 16.7, 0, 2);
    update(factor);
    draw(ts);
    requestAnimationFrame(gameLoop);
  }

  function pointerXFromEvent(e) {
    var rect = canvas.getBoundingClientRect();
    var clientX = 0;
    if (typeof e.clientX === 'number') {
      clientX = e.clientX;
    } else if (e.touches && e.touches[0]) {
      clientX = e.touches[0].clientX;
    } else if (e.changedTouches && e.changedTouches[0]) {
      clientX = e.changedTouches[0].clientX;
    }
    return (clientX - rect.left) * (W / rect.width);
  }

  function handleTap() {
    if (gameOver || gameWin) {
      resetGame();
      return;
    }
    launchBall();
  }

  function bindEvents() {
    window.addEventListener('mousemove', function (e) {
      paddleTarget = pointerXFromEvent(e);
    });
    canvas.addEventListener('mousedown', handleTap);
    canvas.addEventListener('touchstart', function (e) {
      e.preventDefault();
      paddleTarget = pointerXFromEvent(e);
      handleTap();
    }, { passive: false });
    canvas.addEventListener('touchmove', function (e) {
      e.preventDefault();
      paddleTarget = pointerXFromEvent(e);
    }, { passive: false });
    restartBtn.addEventListener('click', resetGame);
    themeBtn.addEventListener('click', toggleTheme);
  }

  function savedThemeKey() {
    try {
      var k = localStorage.getItem('starball-theme');
      return k === 'light' ? 'light' : 'dark';
    } catch (e) {
      return 'dark';
    }
  }

  function init() {
    applyTheme(savedThemeKey(), false);
    setupCanvas();
    initStars();
    resetGame();
    bindEvents();
    requestAnimationFrame(gameLoop);
  }

  init();

  // 测试钩子：供自动化测试读取状态与驱动逻辑
  window.__game = {
    CONFIG: CONFIG,
    W: W,
    H: H,
    paddle: paddle,
    ball: ball,
    resetGame: resetGame,
    resetBall: resetBall,
    launchBall: launchBall,
    update: update,
    setPaddleTarget: function (x) { paddleTarget = x; },
    bricksRef: function () { return bricks; },
    applyTheme: applyTheme,
    themeKey: function () { return currentThemeKey; },
    state: function () {
      return {
        score: score,
        lives: lives,
        gameActive: gameActive,
        gameWin: gameWin,
        gameOver: gameOver,
        bricksLeft: aliveBrickCount()
      };
    }
  };
})();
</script>
</body>
</html>
